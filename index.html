<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Mike's Training System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Inter:wght@300;400;500&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --red:#C0392B;--red2:#a93226;
  --bg:#0A0A0A;--s1:#111;--s2:#181818;--card:#1C1C1C;
  --b1:#222;--b2:#2A2A2A;--b3:#333;
  --amber:#E8A020;--adim:#7A4A00;--aglow:rgba(232,160,32,.07);
  --green:#27AE60;--gdim:rgba(39,174,96,.15);
  --blue:#2980B9;
  --txt:#DEDEDE;--dim:#777;--mid:#AAA;
  --white:#F0F0F0;
}

body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden;}

/* ── HEADER ── */
.hdr{background:var(--s1);border-bottom:3px solid var(--red);padding:14px 14px 0;position:sticky;top:0;z-index:200;}
.hdr-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.hdr h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:clamp(1.5rem,5vw,2rem);text-transform:uppercase;letter-spacing:.04em;color:var(--white);line-height:1;}
.hdr h1 em{font-style:normal;color:var(--red);}
.hdr-sub{font-size:.58rem;color:var(--dim);letter-spacing:.15em;text-transform:uppercase;margin-top:3px;}
.session-badge{background:var(--aglow);border:1px solid var(--adim);border-radius:3px;padding:4px 10px;text-align:center;flex-shrink:0;}
.session-badge .sbn{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1rem;color:var(--amber);line-height:1;}
.session-badge .sbl{font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}
.tabs{display:flex;margin-top:12px;}
.tab{flex:1;padding:9px 2px;background:transparent;color:var(--dim);border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
.tab.on{color:var(--white);border-bottom-color:var(--red);}

/* ── VIEWS ── */
.view{display:none;}.view.on{display:block;}

/* ── TIMER ── */
.tbar{background:var(--s1);padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--b2);flex-wrap:wrap;justify-content:center;}
.tdisp{font-family:'Barlow Condensed',sans-serif;font-size:2.2rem;font-weight:900;color:var(--white);min-width:80px;text-align:center;letter-spacing:.04em;transition:color .3s;}
.tdisp.warn{color:var(--amber);}
.tdisp.done{color:var(--green);}
.tlabel{font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:1px;}
.mode-btns{display:flex;gap:3px;}

/* ── PROGRESS ── */
.prog-wrap{background:var(--s1);padding:8px 14px 10px;border-bottom:1px solid var(--b2);position:sticky;top:var(--hdr-h,84px);z-index:100;}
.prog-row{display:flex;justify-content:space-between;font-size:.58rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
.prog-track{background:var(--b2);height:3px;border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;border-radius:2px;background:var(--red);transition:width .4s ease;}

/* ── BUTTONS ── */
.btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;border:none;cursor:pointer;padding:7px 14px;border-radius:3px;transition:all .15s;white-space:nowrap;}
.br{background:var(--red);color:#fff;}.br:active{background:var(--red2);}
.bs{background:var(--b3);color:var(--txt);}.bs:active{background:#444;}
.ba{background:var(--amber);color:#000;}.ba:active{background:#c8880e;}
.bg{background:var(--green);color:#fff;}.bg:active{background:#219a52;}
.bo{background:transparent;border:1px solid var(--b3);color:var(--dim);}
.bo:active{border-color:var(--amber);color:var(--amber);}
.bo.ck{border-color:var(--green);color:var(--green);background:var(--gdim);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-sm{font-size:.62rem;padding:4px 9px;}

/* ── CONTAINER ── */
.ctr{padding:12px 12px 100px;max-width:700px;margin:0 auto;}

/* ── PHASE BAR ── */
.phase-bar{background:var(--s1);border-left:3px solid var(--amber);padding:10px 12px;margin-bottom:12px;border-radius:0 3px 3px 0;}
.phase-ey{font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);margin-bottom:2px;}
.phase-ti{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.05rem;text-transform:uppercase;color:var(--white);letter-spacing:.02em;}
.phase-de{font-size:.68rem;color:var(--dim);margin-top:4px;line-height:1.6;}

/* ── SWITCHERS ── */
.sw-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;}

/* ── SECTION LABEL ── */
.sec-lbl{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--red);margin:16px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--b1);}

/* ── EXERCISE CARD ── */
.xcard{background:var(--card);border:1px solid var(--b2);border-radius:4px;margin-bottom:6px;overflow:hidden;transition:border-color .15s;}
.xcard.open{border-color:var(--amber);}
.xcard.done{border-color:var(--green);opacity:.72;}
.xtop{display:flex;align-items:flex-start;gap:8px;padding:10px 11px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.xname{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.9rem;text-transform:uppercase;letter-spacing:.03em;color:var(--white);line-height:1.2;}
.xmus{font-size:.57rem;color:var(--amber);letter-spacing:.07em;margin-top:2px;}
.xtags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
.xtag{font-size:.55rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 5px;border-radius:2px;border:1px solid var(--b2);color:var(--dim);}
.xtag.a{border-color:var(--adim);color:var(--amber);background:var(--aglow);}
.xtag.g{border-color:rgba(39,174,96,.3);color:var(--green);background:var(--gdim);}
.xtag.b{border-color:rgba(41,128,185,.3);color:var(--blue);}
.xchk{font-size:.95rem;color:var(--b3);flex-shrink:0;margin-top:1px;transition:color .15s;}
.xcard.done .xchk{color:var(--green);}

/* ── EXERCISE PANEL ── */
.xpanel{display:none;border-top:1px solid var(--b1);background:#151515;padding:11px;}
.xcard.open .xpanel{display:block;}
.panel-lbl{font-size:.54rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:4px;margin-top:10px;}
.panel-lbl:first-child{margin-top:0;}
.cue-txt{font-size:.71rem;color:var(--mid);line-height:1.7;}
.fire-row{display:flex;align-items:center;flex-wrap:wrap;gap:3px;margin-top:5px;}
.fstep{font-size:.57rem;padding:2px 6px;border-radius:2px;border:1px solid var(--b2);color:var(--dim);}
.fstep.p{border-color:var(--adim);color:var(--amber);background:var(--aglow);}
.fstep.r{border-color:rgba(192,57,43,.4);color:#e07070;background:rgba(192,57,43,.06);}
.farrow{color:var(--b3);font-size:.65rem;}
.warn-txt{font-size:.63rem;color:#e07070;margin-top:8px;line-height:1.6;}
.warn-txt::before{content:"⚠ ";}

/* ── SET LOGGER ── */
.set-logger{border-top:1px solid var(--b1);margin-top:10px;padding-top:10px;}
.set-entries{margin-bottom:6px;}
.set-entry{background:var(--s1);border:1px solid var(--b1);border-radius:3px;padding:4px 8px;margin-bottom:3px;font-size:.63rem;color:var(--dim);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.set-entry .snum{color:var(--amber);font-size:.55rem;letter-spacing:.1em;flex-shrink:0;}
.set-entry .sdata{flex:1;}
.set-entry .snote{font-style:italic;color:#555;font-size:.58rem;}
.sform{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:4px;}
.sin{background:var(--s1);border:1px solid var(--b2);border-radius:3px;color:var(--white);padding:6px 8px;font-size:.73rem;outline:none;width:100%;font-family:'Inter',sans-serif;-webkit-appearance:none;}
.sin:focus{border-color:var(--amber);}
.sin.full{grid-column:1/-1;}
.sbtns{display:flex;gap:5px;margin-top:4px;}
.rm-btn{background:none;border:none;color:#c0392b;cursor:pointer;font-size:.9rem;padding:0 4px;flex-shrink:0;}

/* ── SESSION NOTE ── */
.session-note{width:100%;background:var(--s1);border:1px solid var(--b2);border-radius:3px;color:var(--white);padding:8px;font-size:.72rem;outline:none;resize:none;font-family:'Inter',sans-serif;line-height:1.6;}
.session-note:focus{border-color:var(--amber);}

/* ── FINISH BAR ── */
.finish-bar{position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--b2);padding:10px 14px;display:flex;gap:8px;align-items:center;z-index:150;}
.finish-info{flex:1;}
.finish-main{font-size:.65rem;color:var(--dim);}
.finish-main b{color:var(--amber);}
.finish-phase{font-size:.55rem;color:var(--dim);letter-spacing:.08em;margin-top:1px;}

/* ── HISTORY ── */
.hist-card{background:var(--card);border:1px solid var(--b2);border-radius:4px;padding:11px;margin-bottom:7px;}
.hist-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.hist-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.92rem;text-transform:uppercase;color:var(--white);}
.hist-meta{font-size:.6rem;color:var(--dim);margin-top:2px;line-height:1.5;}
.hist-badge{font-size:.55rem;color:var(--amber);background:var(--aglow);padding:2px 7px;border-radius:2px;border:1px solid var(--adim);flex-shrink:0;}
.hist-note{font-size:.63rem;color:#555;font-style:italic;margin-top:4px;}
.hist-ex{margin-top:7px;border-top:1px solid var(--b1);padding-top:7px;}
.hist-ex-row{font-size:.63rem;color:var(--dim);line-height:1.8;}
.hist-ex-row b{color:var(--mid);}
.hist-expand{background:none;border:none;color:var(--dim);cursor:pointer;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;margin-top:5px;padding:0;font-family:'Barlow Condensed',sans-serif;font-weight:600;}

/* ── AI COACH ── */
.ai-wrap{padding:12px 12px 90px;max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:8px;}
.ai-header{background:var(--s1);border-left:3px solid var(--amber);padding:10px 12px;border-radius:0 3px 3px 0;margin-bottom:4px;}
.aim{border-radius:4px;padding:9px 11px;font-size:.72rem;line-height:1.75;max-width:92%;}
.aim.u{background:#12121e;border:1px solid #1e1e3a;color:#8888cc;align-self:flex-end;}
.aim.a{background:var(--card);border:1px solid var(--b2);color:var(--txt);}
.aim.loading{color:var(--dim);animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.5;}50%{opacity:1;}}
.ai-bar{position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--b2);padding:9px;display:flex;gap:7px;z-index:150;}
.ai-in{flex:1;background:var(--bg);border:1px solid var(--b2);border-radius:3px;color:var(--white);padding:8px 10px;font-size:.73rem;outline:none;font-family:'Inter',sans-serif;}
.ai-in:focus{border-color:var(--amber);}
.qbtn{background:var(--card);border:1px solid var(--b2);border-radius:4px;padding:8px 11px;color:var(--dim);cursor:pointer;font-size:.68rem;text-align:left;width:100%;margin-bottom:5px;transition:border-color .15s,color .15s;-webkit-tap-highlight-color:transparent;}
.qbtn:active{border-color:var(--amber);color:var(--amber);}

/* ── PROGRAM VIEW ── */
.prog-ph-card{background:var(--card);border:1px solid var(--b2);border-left:3px solid var(--b2);border-radius:4px;padding:11px;margin-bottom:9px;transition:border-color .15s;}
.prog-ph-card.cur{border-left-color:var(--red);}
.prog-ph-hd{cursor:pointer;-webkit-tap-highlight-color:transparent;}
.prog-ph-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1rem;text-transform:uppercase;color:var(--white);display:flex;justify-content:space-between;align-items:center;}
.prog-ph-desc{font-size:.67rem;color:var(--dim);line-height:1.6;margin-top:4px;}
.prog-day{border-top:1px solid var(--b1);margin-top:8px;padding-top:8px;font-size:.62rem;color:var(--dim);}
.prog-day b{color:var(--amber);}
.prog-day-exs{margin-top:3px;font-size:.6rem;color:#444;line-height:1.7;}
.prog-day-exs span{color:#555;}
.phase-ex-detail{display:none;}
.phase-ex-detail.open{display:block;}

/* ── STATS STRIP ── */
.stats-strip{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.stat-box{background:var(--card);border:1px solid var(--b2);border-radius:3px;padding:8px 12px;flex:1;min-width:80px;text-align:center;}
.stat-num{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.4rem;color:var(--amber);line-height:1;}
.stat-lbl{font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:2px;}

/* ── EMPTY STATE ── */
.empty{text-align:center;color:var(--dim);font-size:.73rem;padding:36px 16px;line-height:1.9;}
.empty .eicon{font-size:2rem;margin-bottom:10px;}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--b3);border-radius:2px;}
</style>
</head>
<body>

<div class="hdr" id="hdr">
  <div class="hdr-top">
    <div>
      <h1>Mike's <em>Training</em> System</h1>
      <div class="hdr-sub">Neuromuscular Rebuild · Age 42 · Ground Up</div>
    </div>
    <div class="session-badge">
      <div class="sbn" id="badge-num">Ph 1</div>
      <div class="sbl" id="badge-day">Sess A</div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on" onclick="sv('today',this)">Today</button>
    <button class="tab" onclick="sv('history',this)">History</button>
    <button class="tab" onclick="sv('coach',this)">AI Coach</button>
    <button class="tab" onclick="sv('program',this)">Program</button>
  </div>
</div>

<!-- TODAY -->
<div class="view on" id="view-today">
  <div class="tbar">
    <div>
      <div class="tlabel">Session Timer</div>
      <div class="tdisp" id="tdisp">00:00</div>
    </div>
    <button class="btn br" id="tbtn" onclick="toggleTimer()">Start</button>
    <button class="btn bs" onclick="resetTimer()">Reset</button>
    <div>
      <div class="tlabel">Mode</div>
      <div class="mode-btns">
        <button class="btn br btn-sm" id="m-sw" onclick="setMode('sw')">SW</button>
        <button class="btn bs btn-sm" id="m-20" onclick="setMode(20)">20m</button>
        <button class="btn bs btn-sm" id="m-30" onclick="setMode(30)">30m</button>
        <button class="btn bs btn-sm" id="m-45" onclick="setMode(45)">45m</button>
      </div>
    </div>
  </div>
  <div class="prog-wrap" id="prog-wrap">
    <div class="prog-row">
      <span id="prog-txt">0 of 0 complete</span>
      <span id="prog-pct" style="color:var(--red)">0%</span>
    </div>
    <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div class="ctr" id="today-ctr"></div>
  <div class="finish-bar">
    <div class="finish-info">
      <div class="finish-main" id="finish-main">Ready to train</div>
      <div class="finish-phase" id="finish-phase"></div>
    </div>
    <button class="btn bg" id="finish-btn" onclick="finishSession()" disabled>Finish Session →</button>
  </div>
</div>

<!-- HISTORY -->
<div class="view" id="view-history">
  <div class="ctr" id="hist-ctr"></div>
</div>

<!-- AI COACH -->
<div class="view" id="view-coach">
  <div class="ai-wrap" id="ai-msgs"></div>
  <div class="ai-bar">
    <input class="ai-in" id="ai-in" placeholder="Ask your coach anything..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAI();}"/>
    <button class="btn br" id="ai-send" onclick="sendAI()">Send</button>
  </div>
</div>

<!-- PROGRAM -->
<div class="view" id="view-program">
  <div class="ctr" id="prog-ctr"></div>
</div>

<script>

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let cPh=0, cDay=0;
let logs = {};        // {id: {sets:[{reps,wt,note}], done:bool}}
let history = [];
let aiMsgs = [];
let openCards = {};
let logOpen = null;
let tSecs=0, tRun=false, tIv=null, tMode="sw", tCD=0;
let expandedHistory = {};
let expandedPhases = {};

// ═══════════════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════════════
async function ld(k){
  try{const r=await window.storage.get(k);return r?JSON.parse(r.value):null;}catch{return null;}
}
async function sd(k,v){
  try{await window.storage.set(k,JSON.stringify(v));}catch{}
}
async function boot(){
  const h=await ld("mk:h"), ai=await ld("mk:ai"), pr=await ld("mk:pr");
  if(h)history=h;
  if(ai)aiMsgs=ai;
  if(pr){cPh=Math.min(pr.p||0,PROG.length-1);cDay=pr.d||0;}
  updateBadge();
  renderToday();
  renderHistory();
  renderProgram();
  renderAI();
}

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
const gP = () => PROG[cPh];
const gD = () => gP().days[cDay];
const gAll = () => gD().sections.flatMap(s=>s.ex);
const gLog = id => logs[id]||{sets:[],done:false};
const pd = n => String(n).padStart(2,"0");
const fmt = s => `${pd(Math.floor(s/60))}:${pd(s%60)}`;
const doneCount = () => gAll().filter(e=>gLog(e.id).done).length;

function updateBadge(){
  const ph=gP(),dy=gD();
  document.getElementById("badge-num").textContent=`Ph ${ph.phase}`;
  document.getElementById("badge-day").textContent=dy.day.replace("Session ","Sess ");
}

// ═══════════════════════════════════════════════════════
// VIEW SWITCHING
// ═══════════════════════════════════════════════════════
function sv(v,el){
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  document.getElementById("view-"+v).classList.add("on");
  if(el)el.classList.add("on");
  if(v==="history")renderHistory();
  if(v==="program")renderProgram();
  if(v==="coach")renderAI();
}

// ═══════════════════════════════════════════════════════
// TIMER
// ═══════════════════════════════════════════════════════
function setMode(m){
  tMode=m; tRun=false; clearInterval(tIv);
  tSecs = m==="sw" ? 0 : m*60; tCD=tSecs;
  document.getElementById("tdisp").textContent=fmt(tSecs);
  document.getElementById("tdisp").classList.remove("warn","done");
  document.getElementById("tbtn").textContent="Start";
  ["sw","20","30","45"].forEach(k=>{
    const el=document.getElementById("m-"+k);
    if(el){el.className="btn btn-sm "+(String(m)===String(k)?"br":"bs");}
  });
}
function toggleTimer(){
  tRun=!tRun;
  document.getElementById("tbtn").textContent=tRun?"Pause":"Resume";
  if(tRun){
    tIv=setInterval(()=>{
      if(tMode==="sw") tSecs++;
      else{
        tSecs=Math.max(0,tSecs-1);
        if(tSecs===0){tRun=false;clearInterval(tIv);document.getElementById("tbtn").textContent="Start";document.getElementById("tdisp").classList.add("done");}
      }
      document.getElementById("tdisp").textContent=fmt(tSecs);
      document.getElementById("tdisp").classList.toggle("warn",tMode!=="sw"&&tSecs<60&&tSecs>0);
    },1000);
  }else clearInterval(tIv);
}
function resetTimer(){
  clearInterval(tIv);tRun=false;
  tSecs=tMode==="sw"?0:tCD;
  document.getElementById("tdisp").textContent=fmt(tSecs);
  document.getElementById("tdisp").classList.remove("warn","done");
  document.getElementById("tbtn").textContent="Start";
}

// ═══════════════════════════════════════════════════════
// RENDER TODAY
// ═══════════════════════════════════════════════════════
function renderToday(){
  const ph=gP(), dy=gD(), all=gAll(), done=doneCount();
  const pct=all.length?Math.round(done/all.length*100):0;
  document.getElementById("prog-txt").textContent=`${done} of ${all.length} complete`;
  document.getElementById("prog-pct").textContent=pct+"%";
  document.getElementById("prog-fill").style.width=pct+"%";
  document.getElementById("finish-main").innerHTML=`<b>${done}/${all.length}</b> done · ${fmt(tSecs)}`;
  document.getElementById("finish-phase").textContent=`Phase ${ph.phase}: ${ph.name} · ${dy.day}`;
  document.getElementById("finish-btn").disabled=done===0;

  let h = `
    <div class="phase-bar">
      <div class="phase-ey">Phase ${ph.phase} · ${ph.weeks} · ${ph.freq}</div>
      <div class="phase-ti">${ph.name} — ${dy.day}: ${dy.focus}</div>
      <div class="phase-de">${ph.desc}</div>
    </div>
    <div class="sw-row">
      ${PROG.map((p,pi)=>`<button class="btn btn-sm ${pi===cPh?"br":"bs"}" onclick="sPh(${pi})">Ph ${p.phase}</button>`).join("")}
    </div>
    <div class="sw-row">
      ${ph.days.map((d,di)=>`<button class="btn btn-sm ${di===cDay?"ba":"bs"}" onclick="sDay(${di})">${d.day}</button>`).join("")}
    </div>`;

  dy.sections.forEach(sec=>{
    h+=`<div class="sec-lbl">${sec.name}</div>`;
    sec.ex.forEach(ex=>{
      const log=gLog(ex.id), open=openCards[ex.id], lopen=logOpen===ex.id;
      h+=`<div class="xcard${log.done?" done":""}${open?" open":""}" id="xc-${ex.id}">
        <div class="xtop" onclick="tc('${ex.id}')">
          <div style="flex:1">
            <div class="xname">${ex.n}</div>
            <div class="xmus">${ex.m}</div>
            <div class="xtags">
              <span class="xtag">${ex.sets} sets</span>
              <span class="xtag">${ex.reps}</span>
              <span class="xtag a">${ex.wt}</span>
              ${log.sets.length?`<span class="xtag g">${log.sets.length} set${log.sets.length>1?"s":""} logged</span>`:""}
            </div>
          </div>
          <span class="xchk">${log.done?"✓":"○"}</span>
        </div>`;

      if(open){
        h+=`<div class="xpanel">
          <div class="panel-lbl">Coaching Cue</div>
          <div class="cue-txt">${ex.cue}</div>`;

        if(ex.fire?.length){
          h+=`<div class="panel-lbl">Firing Order</div><div class="fire-row">`;
          ex.fire.forEach((f,fi)=>{
            h+=`<span class="fstep${f.p?" p":""}">${f.t}</span>`;
            if(fi<ex.fire.length-1) h+=`<span class="farrow">→</span>`;
          });
          h+=`</div>`;
        }

        if(ex.warn) h+=`<div class="warn-txt">${ex.warn}</div>`;

        h+=`<div class="set-logger">
          <div class="panel-lbl">Log Your Sets</div>
          <div class="set-entries">`;

        log.sets.forEach((s,si)=>{
          h+=`<div class="set-entry">
            <span class="snum">SET ${si+1}</span>
            <span class="sdata">${s.reps} reps · ${s.wt}${s.note?` <span class="snote">· ${s.note}</span>`:""}</span>
            <button class="rm-btn" onclick="rmSet('${ex.id}',${si})">✕</button>
          </div>`;
        });

        h+=`</div>`;

        if(lopen){
          h+=`<div class="sform">
            <input class="sin" id="ir-${ex.id}" type="text" inputmode="numeric" placeholder="Reps" onkeydown="if(event.key==='Enter')addSet('${ex.id}')"/>
            <input class="sin" id="iw-${ex.id}" type="text" placeholder="Weight / BW" onkeydown="if(event.key==='Enter')addSet('${ex.id}')"/>
            <input class="sin full" id="in-${ex.id}" type="text" placeholder="Notes (optional — form cues, how it felt...)" onkeydown="if(event.key==='Enter')addSet('${ex.id}')"/>
          </div>
          <div class="sbtns">
            <button class="btn btn-sm br" onclick="addSet('${ex.id}')">+ Add Set</button>
            <button class="btn btn-sm bs" onclick="closeLog()">Done</button>
          </div>`;
        }else{
          h+=`<button class="btn btn-sm bs" style="margin-top:3px" onclick="openLog('${ex.id}')">+ Log Set</button>`;
        }

        h+=`</div>
          <div style="display:flex;gap:6px;margin-top:10px;align-items:center">
            <button class="btn btn-sm bo${log.done?" ck":""}" onclick="toggleDone('${ex.id}')">${log.done?"✓ Complete":"Mark Complete"}</button>
          </div>
        </div>`;
      }

      h+=`</div>`;
    });
  });

  h+=`<div style="margin-top:18px">
    <div class="panel-lbl" style="color:var(--dim)">Session Notes</div>
    <textarea class="session-note" id="session-note" rows="3" placeholder="How did this session feel? Pain, compensation patterns you noticed, wins, energy level..."></textarea>
  </div>`;

  document.getElementById("today-ctr").innerHTML=h;

  // Restore focus if logger was open
  if(logOpen){
    const el=document.getElementById("ir-"+logOpen);
    if(el) setTimeout(()=>el.focus(),50);
  }
}

function sPh(pi){cPh=pi;cDay=0;logs={};openCards={};logOpen=null;updateBadge();renderToday();}
function sDay(di){cDay=di;logs={};openCards={};logOpen=null;updateBadge();renderToday();}

function tc(id){
  openCards[id]=!openCards[id];
  if(logOpen!==id) logOpen=null;
  renderToday();
  setTimeout(()=>{
    const el=document.getElementById("xc-"+id);
    if(el&&openCards[id]) el.scrollIntoView({behavior:"smooth",block:"nearest"});
  },50);
}

function openLog(id){logOpen=id;renderToday();}
function closeLog(){logOpen=null;renderToday();}

function addSet(id){
  const r=document.getElementById("ir-"+id);
  const w=document.getElementById("iw-"+id);
  const n=document.getElementById("in-"+id);
  if(!r||!r.value.trim())return;
  const prev=gLog(id);
  logs[id]={...prev,sets:[...prev.sets,{reps:r.value.trim(),wt:w?.value.trim()||"BW",note:n?.value.trim()||""}]};
  renderToday();
}

function rmSet(id,idx){
  const prev=gLog(id);
  logs[id]={...prev,sets:prev.sets.filter((_,i)=>i!==idx)};
  renderToday();
}

function toggleDone(id){
  const prev=gLog(id);
  logs[id]={...prev,done:!prev.done};
  renderToday();
}

// ═══════════════════════════════════════════════════════
// FINISH SESSION
// ═══════════════════════════════════════════════════════
async function finishSession(){
  const ph=gP(), dy=gD(), all=gAll();
  const noteEl=document.getElementById("session-note");
  const session={
    phase:cPh+1, phaseName:ph.name,
    dayIdx:cDay, dayName:dy.day, focus:dy.focus,
    date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),
    timestamp:Date.now(),
    duration:fmt(tSecs),
    note:noteEl?.value||"",
    exercises:all.map(e=>({
      id:e.id, name:e.n, muscles:e.m,
      target:{sets:e.sets,reps:e.reps,wt:e.wt},
      logged:gLog(e.id).sets,
      done:gLog(e.id).done
    }))
  };

  history=[session,...history];
  await sd("mk:h",history);

  // Advance
  let np=cPh, nd=cDay+1;
  if(nd>=gP().days.length){nd=0;np=Math.min(np+1,PROG.length-1);}
  cPh=np; cDay=nd;
  await sd("mk:pr",{p:np,d:nd});

  logs={}; openCards={}; logOpen=null;
  resetTimer();
  updateBadge();
  renderToday();
  renderHistory();

  // Switch to coach and analyze
  const coachTab=document.querySelector(".tab:nth-child(3)");
  sv("coach",coachTab);
  await aiAnalyze(session);
}

// HISTORY
// ═══════════════════════════════════════════════════════
function renderHistory(){
  const totalSessions=history.length;
  const totalSets=history.reduce((a,s)=>a+s.exercises.reduce((b,e)=>b+e.logged.length,0),0);
  const totalDone=history.reduce((a,s)=>a+s.exercises.filter(e=>e.done).length,0);

  let h=`<div class="phase-bar" style="margin-bottom:12px">
    <div class="phase-ey">Session History</div>
    <div class="phase-ti">${totalSessions} Sessions Logged</div>
  </div>`;

  if(totalSessions>0){
    h+=`<div class="stats-strip">
      <div class="stat-box"><div class="stat-num">${totalSessions}</div><div class="stat-lbl">Sessions</div></div>
      <div class="stat-box"><div class="stat-num">${totalSets}</div><div class="stat-lbl">Total Sets</div></div>
      <div class="stat-box"><div class="stat-num">${totalDone}</div><div class="stat-lbl">Exercises Done</div></div>
    </div>`;
  }

  if(!history.length){
    h+=`<div class="empty"><div class="eicon">📋</div>No sessions yet.<br>Complete your first session and it will appear here with all your logged sets.</div>`;
  }

  history.forEach((s,i)=>{
    const logged=s.exercises?.filter(e=>e.logged?.length>0)||[];
    const exp=expandedHistory[i];
    h+=`<div class="hist-card">
      <div class="hist-head">
        <div>
          <div class="hist-title">Phase ${s.phase}: ${s.phaseName} · ${s.dayName}</div>
          <div class="hist-meta">${s.date} · ${s.duration} · ${s.exercises?.filter(e=>e.done).length||0}/${s.exercises?.length||0} complete</div>
          ${s.note?`<div class="hist-note">"${s.note}"</div>`:""}
        </div>
        <span class="hist-badge">#${history.length-i}</span>
      </div>
      ${logged.length?`
        <div class="hist-ex">
          <div class="hist-ex-row">
            ${exp ? logged.map(e=>`<div style="margin-bottom:4px"><b>${e.name}</b><br>${e.logged.map((s,si)=>`<span style="color:#555">Set ${si+1}</span> ${s.reps} reps @ ${s.wt}${s.note?` <em style="color:#444">(${s.note})</em>`:""}`).join(" · ")}</div>`).join("") : logged.slice(0,3).map(e=>`<b>${e.name}</b> ${e.logged.map(s=>`${s.reps}r@${s.wt}`).join(" · ")}`).join("<br>")}
          </div>
          ${logged.length>0?`<button class="hist-expand" onclick="toggleHistExpand(${i})">${exp?"▲ Less":"▼ Full detail"}</button>`:""}
        </div>
      `:""}
    </div>`;
  });

  document.getElementById("hist-ctr").innerHTML=h;
}

function toggleHistExpand(i){
  expandedHistory[i]=!expandedHistory[i];
  renderHistory();
}

function fillAI(q){

async function aiAnalyze(session){

  await callAI(msg);
}

async function sendAI(){
  const inp=document.getElementById("ai-in");
  const msg=inp?.value?.trim();
  if(!msg||document.getElementById("ai-send").disabled)return;
  inp.value="";
  await callAI(msg);
}

async function callAI(userMsg){
  const sys=`You are Mike's personal trainer and neuromuscular rehabilitation coach. Mike is 42 years old rebuilding his body from scratch. Goals: longevity, health, mobility.

CRITICAL CONTEXT:
- Right glute not firing correctly → internal knee rotation → anterior pelvic tilt
- Gluteal amnesia: glutes inhibited, synergists dominating (TFL, hamstrings, lumbar erectors)
- TFL dominance over glute med causing right knee to track inward
- Difficulty with explosive activities and breathing (diaphragm dysfunction)  
- Starting from zero — neuromuscular reprogramming first, strength second

EQUIPMENT: Major Fitness power rack + cable system, bumper plates to 245lb, 45lb Olympic bar, bench press attachment, landmine attachment, rope/straight bar/D-handles/ankle strap cable attachments, Iron Neck device.

COACHING STYLE:
- Specific and evidence-based — reference actual logged data
- Identify firing order failures from the session data
- Celebrate genuine wins — he's rebuilding from a difficult baseline
- Adjust recommendations based on what the numbers show
- Flag when weight is too heavy (lower back compensating, right knee caving) or too light (completed all sets easily)
- Long-term perspective: longevity and mobility over max numbers
- Keep responses focused and actionable — no filler

TRAINING HISTORY (last 3 sessions):
${JSON.stringify(history.slice(0,3),null,2)}`;

  aiMsgs=[...aiMsgs,{role:"user",content:userMsg}];
  document.getElementById("ai-send").disabled=true;

  // Show loading
  const wrap=document.getElementById("ai-msgs");
  wrap.innerHTML+=`<div class="aim a loading" id="ai-loading">Analyzing your session...</div>`;
  wrap.scrollTop=wrap.scrollHeight;

  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        system:sys,
        messages:aiMsgs
      })
    });
    const data=await res.json();
    const reply=data.content?.[0]?.text||"Unable to get a response right now. Please try again.";
    aiMsgs=[...aiMsgs,{role:"assistant",content:reply}];
    await sd("mk:ai",aiMsgs.slice(-24));
  }catch(e){
    aiMsgs=[...aiMsgs,{role:"assistant",content:"Connection error. Check your network and try again."}];
  }

  document.getElementById("ai-send").disabled=false;
  renderAI();
}

boot();
</script>
